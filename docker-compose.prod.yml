services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es requerida en el .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerido en el .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET es requerido en el .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN es requerido en el .env}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-15}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-20971520}
    volumes:
      - backend_uploads:/app/uploads

volumes:
  backend_uploads:
