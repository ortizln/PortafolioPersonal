services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:086411421@192.168.100.125:5432/portfolio_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secret-en-produccion}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cambiar-este-refresh-secret}
      CORS_ORIGIN: http://192.168.100.125,https://alan-tek.com,http://alan-tek.com
      RATE_LIMIT_WINDOW: '15'
      RATE_LIMIT_MAX: '100'
    volumes:
      - backend_uploads:/app/uploads

volumes:
  backend_uploads:
