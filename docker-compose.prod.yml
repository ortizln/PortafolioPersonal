services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:12345@192.168.1.71:5432/portfolio_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secret-en-produccion}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cambiar-este-refresh-secret}
      CORS_ORIGIN: http://192.168.1.71
      RATE_LIMIT_WINDOW: '15'
      RATE_LIMIT_MAX: '100'
    volumes:
      - backend_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  backend_uploads:
