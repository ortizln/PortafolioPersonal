<div class="modal-backdrop" (click)="onBackdropClick()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-icon" [ngClass]="type">
      <svg *ngIf="type === 'danger'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <svg *ngIf="type === 'primary'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <polyline points="9 12 11 14 15 10"/>
      </svg>
    </div>
    <h3 class="modal-title">{{ title }}</h3>
    <p class="modal-message">{{ message }}</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-cancel" (click)="onCancel()">{{ cancelText }}</button>
      <button type="button" class="btn" [ngClass]="type === 'danger' ? 'btn-danger' : 'btn-primary'" (click)="onConfirm()">{{ confirmText }}</button>
    </div>
  </div>
</div>
